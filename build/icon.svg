<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Background: dark cinematic -->
  <rect width="256" height="256" rx="56" fill="#0a0810" />

  <!-- Spider-man inspired red accent (top-right) -->
  <rect width="256" height="256" rx="56" fill="url(#spider-glow)" opacity="0.3" />
  <defs>
    <radialGradient id="spider-glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Spider web lines (top-right corner) -->
  <g stroke="#ef4444" stroke-width="1.2" fill="none" opacity="0.7">
    <path d="M 256 0 L 256 100 M 256 0 L 156 0 M 256 0 L 200 100 M 256 0 L 156 60" />
    <path d="M 256 20 Q 200 20 200 60 M 256 40 Q 170 40 170 80 M 256 60 Q 145 60 145 100" />
  </g>

  <!-- Spider icon (centered) -->
  <g transform="translate(128, 140)" fill="none" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Body -->
    <ellipse cx="0" cy="10" rx="10" ry="15" fill="#ef4444" stroke="none" />
    <circle cx="0" cy="-15" r="7" fill="#ef4444" stroke="none" />
    <!-- Eyes (white) -->
    <circle cx="-3" cy="-17" r="2" fill="#fff" stroke="none" />
    <circle cx="3" cy="-17" r="2" fill="#fff" stroke="none" />
    <!-- Legs (4 per side) -->
    <path d="M -8 5 C -25 0 -40 8 -55 18" />
    <path d="M -8 12 C -30 14 -50 18 -65 25" />
    <path d="M -7 20 C -25 28 -40 35 -50 50" />
    <path d="M -3 25 C -10 38 -15 50 -18 65" />
    <path d="M 8 5 C 25 0 40 8 55 18" />
    <path d="M 8 12 C 30 14 50 18 65 25" />
    <path d="M 7 20 C 25 28 40 35 50 50" />
    <path d="M 3 25 C 10 38 15 50 18 65" />
  </g>
</svg>
