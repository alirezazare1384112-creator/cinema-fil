# electron-builder configuration for Cinephile Vault.
# Docs: https://www.electron.build/configuration
#
# Build commands:
#   npm run electron:dist    # produces dist-electron/CinephileVault-Setup-1.0.0.exe (NSIS installer)
#   npm run electron:pack    # produces dist-electron/win-unpacked/ (portable folder)

appId: com.alirezazare.cinephilevault
productName: Cinephile Vault
copyright: Copyright (c) 2026 Alireza Zare

# Where to put the final .exe (after build)
directories:
  output: dist-electron
  buildResources: build

# Files included in the Electron app
# (relative to project root)
files:
  - electron/**
  - package.json
  - '!**/.env'
  - '!**/.env.*'
  - '!**/node_modules/*/{CHANGELOG.md,README.md,readme.md,readme,readme.txt,README,readme!md}'
  - '!**/node_modules/**/{test,__tests__,tests,docs,doc,*.markdown,*.md,*.ts,*.flow,*.tsbuildinfo,.bin}'
  - '!**/node_modules/**/{LICENSE,LICENCE,license,licence,BSD,GPL,MIT,UNLICENSE}'
  - '!**/{.DS_Store,.git,.gitignore,.vscode,.idea,docs,doc,tests,test,coverage,*.log,CHANGELOG.md,README.md}'

# Resources — bundled Next.js standalone server goes here (out-of-ASAR, accessible via path)
# The main process spawns `node app/.next/standalone/server.js` from resourcesPath
extraResources:
  - from: .next/standalone
    to: app/.next/standalone
    filter: ['**/*']
  - from: .next/static
    to: app/.next/static
    filter: ['**/*']
  - from: public
    to: app/public
    filter: ['**/*']
  - from: prisma
    to: app/prisma
    filter: ['**/*', '!dev.db', '!dev.db-journal']
  - from: prisma.config.ts
    to: app/prisma.config.ts

# Windows NSIS installer configuration
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: CinephileVault-${version}-Setup.${ext}
  publisherName: Alireza Zare
  # Code signing: requires CSC_LINK env var pointing to a PFX cert.
  # Without it, Windows SmartScreen will show "unknown publisher" warning
  # on first run. Acceptable for personal use; not for public distribution.
  # signtoolOptions:
  #   certificateFile: ${env.CSC_LINK}
  #   certificatePassword: ${env.CSC_KEY_PASSWORD}

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Cinephile Vault
  menuCategory: Cinephile
  # Show license agreement in installer (uses LICENSE file)
  license: LICENSE
  # Custom installer languages (English + Persian if available)
  installerLanguages:
    - en_US
  deleteAppDataOnUninstall: false
  # Display name shown in Add/Remove Programs
  uninstallDisplayName: Cinephile Vault

# Portable target — produces a single .exe that doesn't need installation
# (uncomment to also produce CinephileVault-1.0.0-portable.exe)
# portable:
#   artifactName: CinephileVault-${version}-portable.${ext}

# Publish configuration — used by `electron:publish` to upload to GitHub Releases
# We use a separate GitHub Actions workflow for this instead.
publish:
  provider: github
  owner: alirezazare1384112-creator
  repo: cinema-fil
  releaseType: release
