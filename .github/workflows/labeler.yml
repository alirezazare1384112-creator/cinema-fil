name: 🏷️ Auto-label PR

# وقتی یه Pull Request باز یا آپدیت میشه، بر اساس فایل‌هایی که تغییر کردن،
# labelهای مربوطه خودکار اعمال میشن (theme, ui, api, database, docs, ci, ...).
# این کار triage رو سریع‌تر می‌کنه و reviewerها می‌فهمن PR چه نوعیه.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  label:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (merge commit only — no checkout of PR head)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply labels based on changed files
        uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true

      - name: Add 'needs-review' label to new PRs
        if: github.event.action == 'opened'
        uses: actions-ecosystem/action-add-labels@v1
        with:
          labels: needs-review

      - name: Greet the contributor (first-time PRs only)
        if: github.event.action == 'opened'
        uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          pr-message: |
            👋 ممنون از PR! یه نگاه میندازم و به‌زودی feedback می‌دم.
            Thanks for the PR! I'll take a look and leave feedback soon.
